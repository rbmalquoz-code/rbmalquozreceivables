<!doctype html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6E9E8;--surface:#F8F9F8;--raised:#fff;--ink:#1B2935;--muted:#5B6A72;--line:#CBD2D1;--steel:#2C5A86;--steel-soft:#DDE7F1;--green:#2A7549;--green-soft:#DDEEE3;--red:#B23A28;--red-soft:#F7E1DC;--amber:#A86F0B;--amber-soft:#F6EAD0;
--ui:"Barlow",system-ui,"Segoe UI",Arial,sans-serif;--num:"Barlow Semi Condensed","Barlow",system-ui,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B21;--surface:#1B242C;--raised:#222D36;--ink:#E4E9EC;--muted:#98A6AE;--line:#33414B;--steel:#7FA9D3;--steel-soft:#1E2F40;--green:#6CC592;--green-soft:#1D3528;--red:#F0806C;--red-soft:#3D221D;--amber:#E3B45A;--amber-soft:#3A2F17}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
label>input,label>select,label>textarea{margin-top:4px}
.demo{background:var(--amber-soft);font-size:13.5px;padding:8px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo select{width:auto;padding:3px 6px;margin-left:6px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;width:min(380px,100%);display:grid;gap:14px}
.gate h1{margin:0;font:700 26px/1.1 var(--num)} .gate p{margin:0;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:42px;height:42px;border-radius:8px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 15px var(--num)}
.brand h1{margin:0;font:700 22px/1 var(--num)} .brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.who{display:flex;gap:10px;align-items:center;font-size:14px}
.role{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--steel-soft);color:var(--steel);font-weight:600;text-transform:capitalize}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mnav h2{margin:0 6px;font:700 clamp(28px,5vw,44px)/1 var(--num)}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.mnav input{width:auto;padding:6px 8px}
.strip{margin:16px 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.collect{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.pct{font:700 56px/.9 var(--num);color:var(--green)}
.collect p{margin:0;color:var(--muted)} .collect b{color:var(--ink);font-family:var(--num);font-size:18px}
.bar{position:relative;height:20px;border-radius:4px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%),var(--bg);margin:14px 0 18px;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--green);transition:width .5s}
.bar i{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--red) 0 6px,transparent 6px 11px);opacity:.6}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 22px;margin:0}
.figs div{border-left:3px solid var(--line);padding-left:10px}
.figs dt{font-size:13px;color:var(--muted)} .figs dd{margin:0;font:600 22px var(--num)}
.figs .r{border-color:var(--red)} .figs .r dd{color:var(--red)} .figs .b{border-color:var(--steel)}
.figs small{display:block;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0}
.toolbar input[type=search]{flex:1 1 220px;max-width:340px} .toolbar select{width:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chip b{font-family:var(--num);margin-left:4px} .chip.on{background:var(--ink);color:var(--surface)} .chip.od.on{background:var(--red);border-color:var(--red)}
.sp{flex:1}
.sheet{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:40px}
table{border-collapse:collapse;width:100%;min-width:1060px}
.sheet.narrow table{min-width:720px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.n{text-align:right;white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15.5px}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--bg)}
td.party{font-weight:600;min-width:220px}
td.party small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
tr.od{background:var(--red-soft)} tr.od td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.red{color:var(--red)} .green{color:var(--green)} .muted{color:var(--muted)}
.late{display:block;font:500 12px var(--ui);color:var(--red)}
tfoot td{font-weight:700;background:var(--bg)}
.tag{display:inline-block;font:600 11.5px var(--ui);padding:1px 7px;border-radius:4px;margin:2px 4px 0 0;white-space:nowrap}
.t-paid{background:var(--green-soft);color:var(--green)} .t-od{background:var(--red);color:#fff} .t-part{background:var(--amber-soft);color:var(--amber)}
.t-due,.t-pdc{background:var(--steel-soft);color:var(--steel)} .t-legal{background:var(--ink);color:var(--surface)} .t-bounced{background:var(--red-soft);color:var(--red)}
td.st{max-width:230px;font-size:13.5px} td.st small{display:block;color:var(--muted);font-size:12px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)} .empty h3{color:var(--ink);font:600 20px var(--num);margin:0 0 6px} .empty .btn{margin:14px 4px 0}
.scrim{position:fixed;inset:0;background:rgba(15,22,28,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow-y:auto;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);padding-bottom:40px}

.dhead h3{margin:0;font:700 22px/1.15 var(--num)} .dhead p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.dsec{padding:16px 20px;border-bottom:1px solid var(--line)}
.dsec h4{margin:0 0 10px;font:600 16px var(--num)}
.dfigs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.dfigs div{background:var(--bg);border-radius:6px;padding:8px 10px}
.dfigs dt{font-size:12px;color:var(--muted)} .dfigs dd{margin:0;font:600 19px var(--num)}
.dfigs .hot{background:var(--red-soft)} .dfigs .hot dd{color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .full{grid-column:1/-1}
.qs{display:flex;gap:6px;flex-wrap:wrap} .qs button{font-size:12px;border:1px dashed var(--line);background:none;border-radius:4px;padding:3px 8px;cursor:pointer}
.meta{font-size:12.5px;color:var(--muted);margin:0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.item .amt{font:600 16px var(--num);text-align:right} .item .sub{color:var(--muted);font-size:12.5px} .item .ops{grid-column:1/-1;display:flex;gap:6px}
.item.od .amt{color:var(--red)}
summary{cursor:pointer;font:600 16px var(--num)} details[open] summary{margin-bottom:10px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:22px;width:min(480px,94vw)}
dialog::backdrop{background:rgba(15,22,28,.4)} dialog h3{margin:0 0 14px;font:700 20px var(--num)} dialog form{display:grid;gap:12px}
.dacts{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1} #toast.err{background:var(--red)}
body:not(.can-edit) .edit-only{display:none!important} body:not(.is-admin) .admin-only{display:none!important} body:not(.live) .live-only{display:none!important}
@media (max-width:640px){.wrap{padding:0 12px}.dfigs,.g2{grid-template-columns:1fr 1fr}.pct{font-size:44px}}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>

<body>
<div id="demoBar" class="demo" hidden>
  <span>Demo mode: data stays in this browser only. Paste your Google Script link into index.html to go live.</span>
  <button class="btn sm ghost" id="demoReset">Clear demo data</button>
</div>

<section id="login" class="gate" hidden>
  <form id="loginForm" class="box">
    <div><h1>RBM Receivables</h1><p>Reality Building Materials Trading LLC</p></div>
    <label>Your name<input id="lName" required autocomplete="name" placeholder="Shown on payments you record"></label>
    <label>Password<input type="password" id="lPass" required autocomplete="current-password"></label>

<main id="main" class="wrap" hidden>
  <header class="top">
    <div class="brand"><div class="mark">RBM</div><div><h1>Receivables</h1><p>Reality Building Materials Trading LLC</p></div></div>
    <div class="who"><span id="whoName"></span><span id="sync" class="role">Live</span><button class="btn ghost sm live-only" data-signout>Sign out</button></div>

  <div class="monthbar">
    <div class="mnav"><button class="arrow" id="mPrev" aria-label="Previous month">‹</button><h2 id="mTitle"></h2><button class="arrow" id="mNext" aria-label="Next month">›</button><input type="month" id="mPick" aria-label="Pick month"></div>
    <button class="btn ghost" id="mToday">This month</button>
  </div>
  <section class="strip" id="strip"></section>
  <nav class="tabs">
    <button data-tab="sheet" class="on">Monthly sheet</button><button data-tab="log">Payments received</button><button data-tab="parties">Parties</button>
  </nav>
  <section id="tab-sheet">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search party, phone or status"><div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div><span class="sp"></span>
      <select id="sort" aria-label="Sort"><option value="overdue">Most overdue first</option><option value="balance">Highest balance first</option><option value="name">Party A–Z</option></select>

  <section id="tab-parties" hidden><div class="toolbar"><input type="search" id="pq" placeholder="Search parties"><span class="sp"></span><button class="btn edit-only" data-act="addParty">Add party</button></div><div class="sheet narrow" id="partiesWrap"></div></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<dialog id="partyDlg"><h3>Add party</h3>
  <form id="partyForm" method="dialog">
    <label>Party name<input name="name" required></label>
    <div class="g2">
      <label>Credit terms (days)<input name="terms" type="number" min="0" value="30"></label>
      <label>Contact number<input name="contact" placeholder="+971 5x xxx xxxx"></label>
      <label class="full">Email<input name="email" type="email"></label>
      <label class="full" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input name="legal" type="checkbox" style="width:auto;margin:0">Under legal action</label>
    </div>

  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== PASTE YOUR GOOGLE APPS SCRIPT WEB APP LINK HERE (see README) =====
   While it starts with PASTE, the page runs in demo mode (data stays in this browser). */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzW9OBFKz8Oz2JU1a1PfoCaj2T2IaZx0NCMnSBmTEAuuKMSF01Y9Cwt9zeC4pPGPpA/exec";
const COMPANY = "Reality Building Materials Trading LLC";
const LIVE = SCRIPT_URL.startsWith("https://script.google.com/");

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const fmt = n => r2(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fz = n => Math.abs(r2(n)) < 0.005 ? "–" : fmt(n);
const cr = n => n < -0.009 ? fmt(-n) + " Cr" : fz(n);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const thisMonth = () => today().slice(0, 7);
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return isoOf(new Date(y, m - 1, d + (+n || 0))); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00") - new Date(a + "T00:00")) / 864e5);
const monthAdd = (m, k) => { const [y, mo] = m.split("-").map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthEnd = m => { const [y, mo] = m.split("-").map(Number); return `${m}-${pad(new Date(y, mo, 0).getDate())}`; };
const mLabel = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleString("en-US", {month: "long", year: "numeric"}); };
const fDate = iso => iso ? new Date(iso + "T00:00").toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"}) : "–";
const mkey = m => "m" + m.replace("-", "");
const clean = o => JSON.parse(JSON.stringify(o));
const total = a => r2(a.reduce((s, x) => s + (+x.amount || 0), 0));
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isNaN(n) ? null : r2(n); };
const inMonth = (iso, m) => iso >= m + "-01" && iso <= monthEnd(m);
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "show" + (err ? " err" : ""); clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 2600); }
function show(id) { ["login", "main"].forEach(x => $("#" + x).hidden = x !== id); }

/* ---------- storage: demo (browser) or Firebase (live, shared) ---------- */
class LocalStore {
  constructor() { this.k = "rbm-receivables"; try { this.d = JSON.parse(localStorage.getItem(this.k)); } catch (e) {} this.d ||= {parties: {}, dues: {}, payments: {}}; this.subs = new Set(); }
  snap() { return {parties: Object.values(this.d.parties), dues: Object.values(this.d.dues), payments: Object.values(this.d.payments)}; }
  _save() { try { localStorage.setItem(this.k, JSON.stringify(this.d)); } catch (e) {} this.subs.forEach(f => f(this.snap())); }
  subscribe(cb) { this.subs.add(cb); cb(this.snap()); return () => this.subs.delete(cb); }
  async add(col, o) { this.d[col][o.id] = clean(o); this._save(); }
  async addMany(items) { items.forEach(([c, o]) => this.d[c][o.id] = clean(o)); this._save(); }
  async update(col, id, patch) { Object.assign(this.d[col][id], clean(patch)); this._save(); }
  async setMonthly(id, m, v) { const p = this.d.parties[id]; p.monthly ||= {}; p.monthly[mkey(m)] = clean(v); this._save(); }
  async remove(col, id) { delete this.d[col][id]; this._save(); }
  reset() { this.d = {parties: {}, dues: {}, payments: {}}; this._save(); }
}
class SheetStore {
  constructor(pw) { this.pw = pw; this.cb = null; this.busy = 0; }
  async call(body) {
    this.busy++; $("#sync").textContent = "Saving…";
    try { const r = await fetch(SCRIPT_URL, {method: "POST", body: JSON.stringify({...body, pw: this.pw})});
      const j = await r.json(); if (!j.ok) throw new Error(j.error || "Request failed"); return j.data; }
    finally { if (--this.busy === 0) $("#sync").textContent = "Live"; }
  }
  async refresh() { try { const d = await this.call({action: "all"}); this.cb && this.cb(d); } catch (e) { toast("Couldn't load data: " + e.message, true); } }
  subscribe(cb) { this.cb = cb; this.refresh(); const t = setInterval(() => { if (!document.hidden && !document.querySelector("dialog[open]")) this.refresh(); }, 20000); return () => clearInterval(t); }
  async add(col, o) { await this.call({action: "add", col, obj: clean(o)}); await this.refresh(); }
  async addMany(items) { await this.call({action: "addMany", items: clean(items)}); await this.refresh(); }
  async update(col, id, patch) { await this.call({action: "update", col, id, patch: clean(patch)}); await this.refresh(); }
  async setMonthly(id, m, v) { await this.call({action: "monthly", id, key: mkey(m), val: clean(v)}); await this.refresh(); }
  async remove(col, id) { await this.call({action: "remove", col, id}); await this.refresh(); }
}

let store, me = null, unsub = null;
const S = {parties: [], dues: [], payments: [], month: thisMonth(), filter: "all", q: "", pq: "", sort: "overdue", tab: "sheet", open: null};
const canEdit = () => true, isAdmin = () => true;

/* ---------- engine: automatic carry-forward + overdue ----------
   Every invoice has a due date (invoice date + credit days). Payments settle the oldest invoices first.
   Whatever is unpaid at the end of a month is automatically the "carried forward" of the next month. */
function duesOf(p) { return S.dues.filter(d => d.partyId === p.id).sort((a, b) => a.date.localeCompare(b.date) || (a.at || 0) - (b.at || 0)); }
function paysOf(p) { return S.payments.filter(x => x.partyId === p.id && !x.bounced); }
function rowFor(p, m) {
  const start = m + "-01", end = monthEnd(m), asOf = end < today() ? end : today();
  const dues = duesOf(p), pays = paysOf(p);
  const carried = r2(total(dues.filter(d => d.date < start)) - total(pays.filter(x => x.date < start)));
  const newAmt = total(dues.filter(d => inMonth(d.date, m))), received = total(pays.filter(x => inMonth(x.date, m)));
  const totalDue = r2(carried + newAmt), balance = r2(totalDue - received);
  let pool = total(pays.filter(x => x.date <= asOf)), overdue = 0, late = 0;
  for (const d of dues.filter(d => d.date <= end)) {
    const cover = Math.min(pool, +d.amount); pool = r2(pool - cover); const open = r2(d.amount - cover);
    if (open > 0.009 && d.dueDate < asOf) { overdue += open; late = Math.max(late, daysBetween(d.dueDate, asOf)); }
  }
  const mm = (p.monthly || {})[mkey(m)] || {};
  return {p, carried, newAmt, totalDue, received, balance, overdue: r2(Math.max(0, Math.min(overdue, balance))), late, expected: mm.expected ?? null, status: mm.status || "", by: mm.by || "", at: mm.at || null};
}
function position(p) { // invoice-by-invoice, as of today
  const t = today(); let pool = total(paysOf(p).filter(x => x.date <= t));
  const list = duesOf(p).map(d => { const cover = Math.min(pool, +d.amount); pool = r2(pool - cover); const open = r2(d.amount - cover);
    const st = open <= 0.009 ? "paid" : d.dueDate < t ? "od" : cover > 0 ? "part" : "due";
    return {...d, open, st, days: st === "od" ? daysBetween(d.dueDate, t) : daysBetween(t, d.dueDate)}; });
  return {list, outstanding: r2(total(duesOf(p)) - total(paysOf(p))), overdue: r2(list.filter(d => d.st === "od").reduce((s, d) => s + d.open, 0))};
}
const monthRows = () => S.parties.map(p => rowFor(p, S.month)).filter(r => Math.abs(r.carried) > 0.009 || r.newAmt || r.received || r.expected || r.status);
const stateOf = r => r.p.legal ? "legal" : r.overdue > 0.009 ? "overdue" : r.balance > 0.009 ? "pending" : "cleared";

function strip(rows) {

  const pdc = S.payments.filter(x => !x.bounced && x.mode === "PDC cheque" && (x.chequeDate || "") > today());
  const exp = rows.some(r => r.expected != null) ? t("expected") : null;
  $("#strip").innerHTML = `<div class="collect"><span class="pct">${pct.toFixed(1)}%</span><p>collected: <b>AED ${fmt(rec)}</b> received of <b>AED ${fmt(due)}</b> due in ${mLabel(S.month)}${exp != null ? `, expected AED ${fmt(exp)}` : ""}</p></div>

function wire(p) {

  const df = $("#dueForm"), sync = () => { if (df.date.value) df.dueDate.value = addDays(df.date.value, df.terms.value || 0); };
  df.date.oninput = df.terms.oninput = sync; sync();
  df.onsubmit = async e => { e.preventDefault(); const amount = num(df.amount.value); if (!(amount > 0)) return toast("Enter an amount above zero", true);
    try { await store.add("dues", {id: newId(), partyId: p.id, no: df.no.value.trim(), date: df.date.value, dueDate: df.dueDate.value, amount, by: me.name, at: Date.now()}); df.no.value = ""; df.amount.value = ""; toast("Invoice added"); } catch (err) { toast(err.message, true); } };

  $("#delParty").onclick = async () => { if (!confirm(`Delete ${p.name} with all its invoices and payments?`)) return;
    try { for (const d of S.dues.filter(x => x.partyId === p.id)) await store.remove("dues", d.id); for (const x of S.payments.filter(x => x.partyId === p.id)) await store.remove("payments", x.id); await store.remove("parties", p.id); closeDrawer(); toast("Party deleted"); } catch (err) { toast(err.message, true); } };

}

function exportExcel() {
  if (typeof XLSX === "undefined") return toast("Excel download needs an internet connection.", true);
  const rows = monthRows().sort((a, b) => a.p.name.localeCompare(b.p.name)), t = k => r2(rows.reduce((s, r) => s + (+r[k] || 0), 0));
  const head = ["SL.NO", "PARTY NAME", "CARRIED FORWARD", "NEW THIS MONTH", "TOTAL DUE", "EXPECTED", "RECEIVED", "BALANCE", "OVERDUE", "DAYS LATE", "PAYMENT DAYS", "COLLECTION STATUS", "UPDATED BY", "CONTACT NUMBER", "E-MAIL ADDRESS"];
  const body = rows.map((r, i) => [i + 1, r.p.name, r.carried, r.newAmt, r.totalDue, r.expected, r.received, r.balance, r.overdue || null, r.overdue ? r.late : null, r.p.terms, r.status, r.by, r.p.contact, r.p.email]);
  body.push([], [null, "TOTAL", t("carried"), t("newAmt"), t("totalDue"), t("expected"), t("received"), t("balance"), t("overdue")]);
  const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet([head, ...body]); ws["!cols"] = head.map((h, i) => ({wch: i === 1 ? 40 : i === 11 ? 30 : 14}));
  XLSX.utils.book_append_sheet(wb, ws, "Receivables");
  const names = Object.fromEntries(S.parties.map(p => [p.id, p.name]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["DATE", "PARTY", "AMOUNT", "MODE", "REFERENCE", "CHEQUE DATE", "BOUNCED", "RECORDED BY"], ...S.payments.filter(x => inMonth(x.date, S.month)).sort((a, b) => a.date.localeCompare(b.date)).map(x => [x.date, names[x.partyId] || "", x.amount, x.mode, x.ref, x.chequeDate, x.bounced ? "YES" : "", x.by])]), "Payments");
  XLSX.writeFile(wb, `RBM Receivables ${mLabel(S.month)}.xlsx`);
}

  const P = (name, terms, contact, legal = false) => { const id = newId(); items.push(["parties", {id, name, terms, contact, email: "", legal, monthly: {}, createdAt: now, by: "Demo"}]); return id; };
  const I = (pid, no, date, amount, terms) => items.push(["dues", {id: newId(), partyId: pid, no, date, dueDate: addDays(date, terms), amount, by: "Demo", at: now}]);
  const Y = (pid, date, amount, mode, ref, chequeDate = null) => items.push(["payments", {id: newId(), partyId: pid, date, amount, mode, ref, chequeDate, by: "Demo", at: now, bounced: false}]);
  const a = P("Sample Contracting LLC", 30, "+971 50 000 0001"); I(a, "INV-1041", d(-3, 5), 12000, 30); Y(a, d(-2, 12), 12000, "Bank transfer", "TT 5521"); I(a, "INV-1088", d(-2, 9), 8500, 30); I(a, "INV-1130", d(0, 1), 5200, 30);
  const b = P("Demo Interiors LLC", 60, "+971 55 000 0002"); I(b, "INV-1062", d(-2, 2), 20000, 60); Y(b, d(-1, 20), 10000, "PDC cheque", "CHQ 004512", d(1, 15));
  const c = P("Example Technical Services", 7, "+971 56 000 0003"); I(c, "INV-1101", d(-1, 25), 3450, 7); Y(c, d(0, 2), 3450, "Online transfer", "Ref 88231");
  const e = P("Test Carpentry LLC", 45, "+971 52 000 0004", true); I(e, "INV-0990", d(-4, 14), 15000, 45);
  const f = P("Model Fitout Works", 45, "+971 58 000 0005"); I(f, "INV-1127", d(0, 1), 9800, 45); Y(f, d(0, 1), 2000, "Cash", "Receipt 311");
  store.addMany(items).then(() => toast("Sample data loaded"));
}

/* ---------- wiring + start ---------- */
function setTab(t) { S.tab = t; $$(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t)); ["sheet", "log", "parties"].forEach(x => $("#tab-" + x).hidden = x !== t); render(); }
function applyRole() { document.body.classList.add("can-edit", "is-admin"); $("#whoName").textContent = me.name; }
function start() { show("main"); applyRole(); if (unsub) unsub(); unsub = store.subscribe(s => { Object.assign(S, s); render(); }); }
$$(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#mPrev").onclick = () => { S.month = monthAdd(S.month, -1); render(); };
$("#mNext").onclick = () => { S.month = monthAdd(S.month, 1); render(); };
$("#mToday").onclick = () => { S.month = thisMonth(); render(); };
$("#mPick").onchange = e => { if (e.target.value) { S.month = e.target.value; render(); } };
$("#q").oninput = e => { S.q = e.target.value; render(); };
$("#pq").oninput = e => { S.pq = e.target.value; render(); };
$("#sort").onchange = e => { S.sort = e.target.value; render(); };
$("#chips").onclick = e => { const b = e.target.closest("[data-f]"); if (b) { S.filter = b.dataset.f; render(); } };
$("#exportBtn").onclick = exportExcel;
$("#main").addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "addParty") { $("#partyForm").reset(); return $("#partyDlg").showModal(); }
  if (act === "sample") return sample();
  const tr = e.target.closest("tr[data-id]"); if (tr) openDrawer(tr.dataset.id);
});
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.open && !document.querySelector("dialog[open]")) closeDrawer(); });
$$("[data-signout]").forEach(b => b.onclick = () => { try { localStorage.removeItem("rbm-session"); } catch (e) {} location.reload(); });

if (LIVE) {
  document.body.classList.add("live");
  const enter = async (name, pw, remember) => {
    const s = new SheetStore(pw); await s.call({action: "ping"});
    if (remember) try { localStorage.setItem("rbm-session", JSON.stringify({name, pw})); } catch (e) {}
    store = s; me = {name}; start();
  };
  $("#loginForm").onsubmit = async e => { e.preventDefault(); $("#lErr").hidden = true; $("#lBtn").disabled = true;
    try { await enter($("#lName").value.trim(), $("#lPass").value, true); }
    catch (err) { $("#lErr").textContent = /password/i.test(err.message) ? "Wrong password." : "Couldn't connect: " + err.message; $("#lErr").hidden = false; }
    $("#lBtn").disabled = false; };
  let saved = null; try { saved = JSON.parse(localStorage.getItem("rbm-session")); } catch (e) {}
  if (saved) enter(saved.name, saved.pw, false).catch(() => { localStorage.removeItem("rbm-session"); show("login"); }); else show("login");
} else {
  store = new LocalStore(); $("#demoBar").hidden = false;
  me = {name: "Demo user"};
  $("#demoReset").onclick = () => { if (confirm("Clear all demo data in this browser?")) { closeDrawer(); store.reset(); } };
  start();
}
</script>
</body>
